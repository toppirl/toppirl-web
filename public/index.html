</head>

<body>
    <main class="page">
        <header class="profile">
            <div class="avatar-wrap">
                <span class="avatar-ripple" aria-hidden="true"></span>

                <span class="live-badge" aria-hidden="true"><span class="live-badge-dot"></span>LIVE</span>
                <!-- Pointer shortcut only: keyboard and screen readers use the Watch on Twitch card -->
                <a class="avatar-live-link" href="https://twitch.tv/toppirl" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true" data-live hidden></a>
            </div>
            <h1>Jordan Topp</h1>
            <p class="handle">@toppirL</p>
            <p class="live-meta" data-live data-live-meta hidden></p>
            <p class="tagline">Software Engineer 💻 | Gaming Extraordinaire 🎮</p>
        </header>

        <nav aria-label="Social links">

                        </svg>
                    </a>
                </li>
                <li>
                    <a href="https://twitch.tv/toppirl" target="_blank" rel="noopener noreferrer" aria-label="Twitch">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

                        </svg>

                </li>
                <li>
                    <a href="https://x.com/toppirl" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">

                </li>

                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

                    </a>
                </li> -->
            </ul>
        </nav>

        <!--
            Link cards. To add one, paste a template into the list below, after the live card.
            The thumbnail is either an image (square, 112px or larger, in img/) or an icon tile.

            With an image:
            <li>
                <a class="link-card" href="https://example.com" target="_blank" rel="noopener noreferrer">
                    <img class="link-thumb" src="img/your-image.jpg" alt="" width="56" height="56" loading="lazy" decoding="async">
                    <span class="link-text">
                        <span class="link-title">Desk setup video</span>
                        <span class="link-subtitle">YouTube</span>
                    </span>
                    <svg class="link-arrow icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </a>
            </li>

            With an icon tile (this one is a keyboard):
            <li>
                <a class="link-card" href="https://example.com" target="_blank" rel="noopener noreferrer">
                    <span class="link-thumb" aria-hidden="true">
                        <svg class="icon-line" viewBox="0 0 24 24" focusable="false">
                            <rect x="2" y="6" width="20" height="12" rx="2" />
                            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8" />
                        </svg>
                    </span>
                    <span class="link-text">
                        <span class="link-title">Gear I use</span>
                        <span class="link-subtitle">Keyboard, mic and camera</span>
                    </span>
                    <svg class="link-arrow icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </a>
            </li>
        -->
        <!-- The floor fills the rest of the page; the grid's horizon sits one card-gap above the cards -->
        <div class="floor">
            <div class="bg-grid" aria-hidden="true">
                <div class="bg-grid-floor">
                    <div class="bg-grid-plane"></div>
                </div>
            </div>

            <ul class="links" aria-label="Links">
                <!-- Shown by js/live.js while streaming (see netlify/functions/twitch-live.mjs) -->
                <li data-live hidden>
                    <a class="link-card link-card-live" href="https://twitch.tv/toppirl" target="_blank" rel="noopener noreferrer">
                        <span class="link-thumb" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24" focusable="false">
                                <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0 1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z" />
                            </svg>
                        </span>
                        <span class="link-text">
                            <span class="link-title">Watch on Twitch</span>
                            <span class="link-subtitle" data-live-detail>Come hang out</span>
                        </span>
                        <svg class="link-arrow icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </a>
                </li>
                <!-- The gear page (gear.html), on this site, so it opens in the same tab -->
                <li>
                    <a class="link-card" href="/gear">
                        <span class="link-thumb" aria-hidden="true">
                            <svg class="icon-line" viewBox="0 0 24 24" focusable="false">
                                <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
                                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
                            </svg>
                        </span>
                        <span class="link-text">
                            <span class="link-title">My gear</span>
                            <span class="link-subtitle">What I stream and play with</span>
                        </span>
                        <svg class="link-arrow icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </a>
                </li>
            </ul>
        </div>
    </main>
</body>

</html>
