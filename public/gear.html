<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My gear · toppirL</title>
    <meta name="description" content="The microphone, camera, keyboard and other gear Jordan Topp (@toppirL) streams and plays with.">
    <meta name="theme-color" content="#111827">
    <link rel="canonical" href="https://toppirl.com/gear">

    <!-- Link previews (Discord, iMessage, X, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://toppirl.com/gear">
    <meta property="og:title" content="My gear · toppirL">
    <meta property="og:description" content="What Jordan Topp (@toppirL) streams and plays with.">
    <meta property="og:image" content="https://toppirl.com/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Jordan Topp, @toppirL">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Absolute paths, so they resolve the same whatever URL Netlify serves the page at -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/gear.js"></script>
</head>

<body>
    <main class="page page-gear">
        <header class="profile">
            <a class="back-link" href="/">
                <svg class="icon-line" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                toppirl.com
            </a>
            <div class="avatar-wrap avatar-wrap-small">
                <!-- Swap for <img class="avatar" src="/img/avatar.jpg" alt="" width="64" height="64"> once there's a photo -->
                <div class="avatar" aria-hidden="true">JT</div>
            </div>
            <h1>My gear</h1>
            <p class="tagline">What I stream and play with</p>
        </header>

        <!-- Same floor as the homepage: the horizon sits one card-gap above the first gear card,
             and the first category's heading sits above the horizon -->
        <div class="floor">
            <div class="bg-grid" aria-hidden="true">
                <div class="bg-grid-floor">
                    <div class="bg-grid-plane"></div>
                </div>
            </div>

            <!-- js/gear.js fills this from /api/gear: one section per category, each a heading and a ul.links -->
            <div class="gear" data-gear>
                <noscript>
                    <div class="gear-status">
                        <p class="gear-status-title">The gear list needs JavaScript</p>
                        <p class="link-subtitle">Turn it on and reload the page to see it.</p>
                    </div>
                </noscript>
            </div>

            <footer class="gear-footer">
                <!-- If any links go to Amazon, the Amazon Associates Operating Agreement also requires
                     this exact sentence on the page: "As an Amazon Associate I earn from qualifying purchases."
                     Add it here before the first Amazon link goes live. -->
                <p>Some links are affiliate links, so I may earn a small commission at no cost to you.</p>
            </footer>
        </div>
    </main>
</body>

</html>
